spring:
  application:
    name: economofar-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
        ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  
economofar:
  support:
    email: support@economofar.com
    terms-url: https://economofar.com/terms
    privacy-url: https://economofar.com/privacy
    status-url: https://status.economofar.com